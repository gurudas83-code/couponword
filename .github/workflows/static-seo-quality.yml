name: Static SEO quality gate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: couponworld-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install publication dependencies
        run: python -m pip install -r requirements.txt
      - name: Test main workflow health and safe scheduled automation
        run: python -m unittest -q test_actions_health_monitor
      - name: Test Pages deployment artifact retry contract
        run: python -m unittest -q test_pages_artifact_retry
      - name: Test sitemap canonical and indexability gates
        run: python -m unittest -q test_sitemap_canonical_audit
      - name: Test read-only live-indexing evidence with offline fixtures
        run: python -m unittest -q test_live_indexability_audit
      - name: Test owner GSC CSV import without any account or network calls
        run: python -m unittest -q test_gsc_owner_exports
      - name: Test internal-link discovery audit
        run: python -m unittest -q test_internal_link_audit
      - name: Verify technical-only public niche policy
        run: python -m unittest -q test_technical_niche_publication
      - name: Validate nineteen model illustrations, full specification routes and API-price gates
        run: python -m unittest -q test_new_mobile_media_prices
      - name: Verify recent India model importer and client discovery paths
        run: python -m unittest -q test_india_recent_eight_import test_new_mobile_visibility
      - name: Unit-test generated page-level audit with synthetic fixtures
        run: python -m unittest -q test_frontend_page_audit
      - name: Build the official public artifact
        run: python scripts/build_public_pages.py --output public
      - name: Verify published 11-model hub and 251-model discovery
        run: python -m unittest -q test_india_recent_eight_import test_new_mobile_visibility
      - name: Validate built technical product routes (not just source fixtures)
        run: python -m unittest -q test_technical_niche_publication test_seo_index_hygiene
      - name: Verify six GSC 404 routes with two exact migrations and four intentional retirements
        run: python -m unittest -q test_gsc_404_migrations
      - name: Validate generated sitemap, robots and homepage metadata
        run: python scripts/quality_gate.py --root public
      - name: JavaScript syntax validation
        run: |
          node --check app.js
          node --check mobile-research-preview.js
          node --check assets/cw-query-parser.js
          node --check assets/cw-research-assistant.js
          node --check test_cw_research_assistant.cjs
          node --check test_recommendation_cold_start.cjs
      - name: Test cold-start wait, late success and bounded API timeout without network
        run: node test_recommendation_cold_start.cjs
      - name: Validate first-party voice assistant queries and published research safety
        run: node test_cw_research_assistant.cjs
      - name: Test first three local phone matches without slow optional sources
        run: node test_search_first3_progressive.cjs
      - name: Regression-test Top 3 research filter (no external API calls)
        run: |
          python -m unittest -q test_search_first_frontend
          node test_research_top3.cjs
      - name: Validate research and comparison evidence gates
        run: python scripts/research_quality_gate.py

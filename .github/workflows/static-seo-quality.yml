name: Static SEO quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication dependencies
        run: python -m pip install -r requirements.txt
      - name: Test sitemap canonical and indexability gates
        run: python -m unittest -q test_sitemap_canonical_audit
      - name: Test internal-link discovery audit
        run: python -m unittest -q test_internal_link_audit
      - name: Verify technical-only public niche policy
        run: python -m unittest -q test_technical_niche_publication
      - name: Build the official public artifact
        run: python scripts/build_public_pages.py --output public
      - name: Validate built technical product routes (not just source fixtures)
        run: python -m unittest -q test_technical_niche_publication test_seo_index_hygiene
      - name: Validate generated sitemap, robots and homepage metadata
        run: python scripts/quality_gate.py --root public
      - name: JavaScript syntax validation
        run: |
          node --check app.js
          node --check mobile-research-preview.js
      - name: Validate research and comparison evidence gates
        run: python scripts/research_quality_gate.py

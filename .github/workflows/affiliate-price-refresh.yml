name: Daily Top-30 QuickCommerce price refresh

run-name: Top-30 QuickCommerce price refresh (${{ github.event_name }})

on:
  # 17:00 IST = 11:30 UTC. GitHub Actions may start a few minutes late.
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      pincode:
        description: "Indian delivery pincode used for the retailer observation"
        required: false
        default: "110001"

permissions:
  contents: write

concurrency:
  group: couponworld-affiliate-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test Top-30 price-watch gates
        run: python -m unittest -v test_affiliate_price_refresh test_quickcommerce_flipkart_adapter test_quickcommerce_top30_refresh test_retailer_publication_gate
      - name: Require QuickCommerce API configuration
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$QUICKCOMMERCE_API_KEY" ]]; then
            echo "::error::QUICKCOMMERCE_API_KEY is missing; no Top-30 price refresh can be trusted."
            exit 1
          fi
      - name: Refresh one complete Top-30 batch from QuickCommerce
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
        run: python scripts/refresh_quickcommerce_affiliate_offers.py --pincode "${{ github.event.inputs.pincode || '110001' }}" --delay-seconds 1
      - name: Publish changed offer store through Pages build
        shell: bash
        run: |
          if git diff --quiet -- data/retailer_offers.json; then
            echo "No verified affiliate offer changes to publish."
            exit 0
          fi
          git config user.name "coupon-world-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retailer_offers.json
          git commit -m "chore: refresh verified Top-30 offers"
          git push


name: Research quality gates

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "20 3 * * *" # Daily at 08:50 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install declared app dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exact publication artifact
        run: python scripts/build_public_pages.py --output public
      - name: Audit source-backed public research and dated budgets
        run: python scripts/quality_audit.py --root public --report quality-audit.json
      - name: Verify accessories and TV evidence, pages and comparison script
        run: |
          python -m unittest -v test_category_research_release
          python -m unittest -v test_tv_earbuds_40_release
          python -m py_compile python/tv_earbuds_workbook_pages.py
          python -m py_compile python/category_research_pages.py
          node --check assets/category-research.js
      - name: Preserve existing ranking and research contracts
        run: |
          python -m unittest -v test_phase_g_ranking_contract test_mobile_research_inventory_visibility test_mobile_independent_tests test_phone_guides_release test_phone_research_seo test_hindi_seo_quality test_seo_index_hygiene test_recommendation_timeout_guard test_phase_g_frontend_offer test_frontend_recommendation_layout test_final_mobile_release_ui
          node test_mobile_workbook_queries.cjs
          node test_standard_guide_fallback.cjs
          node test_search_discovery.cjs
      - name: Smoke-test the live public site (scheduled and manual only)
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          urls = {
              'homepage': 'https://coupon-world.in/',
              'catalogue': 'https://coupon-world.in/data/mobile_research_catalogue.json',
              'guide': 'https://coupon-world.in/guides/phone-budget-guides/',
              'phone_hub': 'https://coupon-world.in/phones/',
              'phone_model': 'https://coupon-world.in/phones/samsung-galaxy-a56-5g/',
              'phone_pixel': 'https://coupon-world.in/phones/google-pixel-10/',
              'phone_f05': 'https://coupon-world.in/phones/samsung-galaxy-f05/',
              'backend_health': 'https://couponword.onrender.com/health',
          }
          for name, url in urls.items():
              for attempt in range(3):
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'CouponWorldQualityMonitor/1.0'}), timeout=25) as response:
                          content = response.read()
                          assert response.status == 200, (name, response.status)
                      if name == 'homepage':
                          assert b'mobileResearchSearch' in content, 'Homepage research form missing'
                      elif name == 'catalogue':
                          data = json.loads(content)
                          assert len(data['model_cards']) == 232, 'Production catalogue incomplete'
                      elif name == 'phone_hub':
                          assert b'/phones/samsung-galaxy-a56-5g/' in content, 'Crawlable phone hub link missing'
                      elif name == 'phone_pixel':
                          assert b'Google Pixel 10' in content and b'Manufacturer source' in content, 'Pixel manufacturer evidence page missing'
                      elif name == 'phone_f05':
                          assert b'4G LTE' in content, 'F05 4G network correction not published'
                      elif name == 'phone_model':
                          assert b'Manufacturer source' in content, 'Original manufacturer links missing'
                      elif name == 'backend_health':
                          health = json.loads(content)
                          assert health.get('status') == 'ok', 'Render backend reported unhealthy status'
                          assert health.get('service') == 'coupon-world-shopping-intelligence', 'Unexpected backend service'
                          print('BACKEND REVISION:', health.get('revision') or 'not exposed')
                      else:
                          assert b'phone' in content.lower(), 'Buying guide content missing'
                      print('LIVE PASS:', name, len(content), 'bytes')
                      break
                  except Exception as exc:
                      if attempt == 2:
                          raise RuntimeError('LIVE FAIL: ' + name) from exc
                      time.sleep(3)
          PY
      - name: Verify Render backend health and safe recommendation route
        # PR checks report a remote outage without blocking a static site fix.
        # The daily check fails and alerts if the production API is unreachable.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python scripts/verify_runtime_health.py
      - name: Unit-test remote probe contract
        run: python -m unittest -v test_runtime_health_probe
      - name: Confirm browser script syntax
        run: |
          node --check app.js
          node --check mobile-research-preview.js

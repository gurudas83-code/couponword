name: Research quality gates

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "20 3 * * *" # Daily at 08:50 IST
  workflow_dispatch:

concurrency:
  group: couponworld-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install declared app dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exact publication artifact
        run: python scripts/build_public_pages.py --output public
      - name: Build URL-by-URL frontend and SEO audit report
        run: python scripts/frontend_page_audit.py --root public --out frontend-page-audit.json
      - name: Upload audit of every generated public HTML route
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coupon-world-frontend-page-audit
          path: frontend-page-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Audit source-backed public research and dated budgets
        run: python scripts/quality_audit.py --root public --report quality-audit.json
      - name: Reconcile all 232 model price-evidence states without paid calls
        run: |
          python -m unittest -v test_price_evidence_coverage
          python scripts/build_price_evidence_coverage.py --out price-evidence-232.json --report-dir price-evidence-reports
      - name: Upload non-live price evidence and 103-model verification queue
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coupon-world-price-evidence-232
          path: |
            price-evidence-232.json
            price-evidence-reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify accessories and TV evidence, pages and comparison script
        run: |
          python -m unittest -v test_category_research_release
          python -m unittest -v test_tv_earbuds_40_release
          python -m unittest -v test_retailer_publication_gate
          python -m unittest -v test_india_sales_priority_release
          python -m unittest -v test_india_missing_eight_release
          python -m unittest -v test_mobile_seo_comparisons
          python -m py_compile python/mobile_seo_comparisons.py
          python -m py_compile python/india_sales_priority_pages.py
          python -m py_compile python/india_missing_eight_pages.py
          python -m py_compile python/tv_earbuds_workbook_pages.py
          python -m py_compile python/category_research_pages.py
          node --check assets/category-research.js
      - name: Preserve existing ranking and research contracts
        run: |
          python -m unittest -v test_phase_g_ranking_contract test_mobile_research_inventory_visibility test_mobile_independent_tests test_publication_policy test_mobile_query_answers test_research_usability test_phone_guides_release test_phone_research_seo test_top30_pilot_seo test_top30_seo_source_leads test_hindi_seo_quality test_seo_index_hygiene test_recommendation_timeout_guard test_phase_g_frontend_offer test_frontend_recommendation_layout test_final_mobile_release_ui
          node test_mobile_workbook_queries.cjs
          node test_standard_guide_fallback.cjs
          node test_search_discovery.cjs
      - name: Validate guarded paid API integration without billed calls
        run: |
          python -m unittest -v test_paid_api_live_bridge test_api_price_observations test_quickcommerce_flipkart_adapter
          python -m py_compile python/paid_api_live_bridge.py python/shopping_api.py
          node --check assets/retailer-observations.js
      - name: Smoke-test live GitHub Pages content (scheduled and manual only)
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          urls = {
              'homepage': 'https://coupon-world.in/',
              'catalogue': 'https://coupon-world.in/data/mobile_research_catalogue.json',
              'guide': 'https://coupon-world.in/guides/phone-budget-guides/',
              'phone_hub': 'https://coupon-world.in/phones/',
              'phone_model': 'https://coupon-world.in/phones/samsung-galaxy-a56-5g/',
              'phone_pixel': 'https://coupon-world.in/phones/google-pixel-10/',
              'phone_f05': 'https://coupon-world.in/phones/samsung-galaxy-f05/',
          }
          for name, url in urls.items():
              for attempt in range(3):
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'CouponWorldQualityMonitor/1.0'}), timeout=25) as response:
                          content = response.read()
                          assert response.status == 200, (name, response.status)
                      if name == 'homepage':
                          assert b'mobileResearchSearch' in content, 'Homepage research form missing'
                      elif name == 'catalogue':
                          data = json.loads(content)
                          assert len(data['model_cards']) == 232, 'Production catalogue incomplete'
                      elif name == 'phone_hub':
                          assert b'/phones/samsung-galaxy-a56-5g/' in content, 'Crawlable phone hub link missing'
                      elif name == 'phone_pixel':
                          assert b'Google Pixel 10' in content and b'Manufacturer source' in content, 'Pixel manufacturer evidence page missing'
                      elif name == 'phone_f05':
                          assert b'4G LTE' in content, 'F05 4G network correction not published'
                      elif name == 'phone_model':
                          assert b'Manufacturer source' in content, 'Original manufacturer links missing'
                      else:
                          assert b'phone' in content.lower(), 'Buying guide content missing'
                      print('LIVE PASS:', name, len(content), 'bytes')
                      break
                  except Exception as exc:
                      if attempt == 2:
                          raise RuntimeError('LIVE FAIL: ' + name) from exc
                      time.sleep(3)
          PY
      - name: Verify Render backend health and safe recommendation route
        # A remote production API can cold-start slowly. It is not the PR's
        # candidate code, so do not hold every unrelated PR for a remote call.
        # Scheduled/manual runs FAIL if Render remains down or unsafe, using
        # the dedicated long-retry strict probe. The next step tests probe logic
        # on all events, including pull requests.
        if: github.event_name != 'pull_request'
        run: python scripts/verify_runtime_health.py
      - name: Unit-test remote probe contract
        run: python -m unittest -v test_runtime_health_probe
      - name: Confirm browser script syntax
        run: |
          node --check app.js
          node --check mobile-research-preview.js

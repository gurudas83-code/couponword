name: Research quality gates

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "20 3 * * *" # Daily at 08:50 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install declared app dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exact publication artifact
        run: python scripts/build_public_pages.py --output public
      - name: Audit source-backed public research and dated budgets
        run: python scripts/quality_audit.py --root public --report quality-audit.json
      - name: Preserve existing ranking and research contracts
        run: |
          python -m unittest -v test_phase_g_ranking_contract test_mobile_research_inventory_visibility test_mobile_independent_tests test_phone_guides_release test_recommendation_timeout_guard
          node test_mobile_workbook_queries.cjs
          node test_standard_guide_fallback.cjs
          node test_search_discovery.cjs
      - name: Confirm browser script syntax
        run: |
          node --check app.js
          node --check mobile-research-preview.js

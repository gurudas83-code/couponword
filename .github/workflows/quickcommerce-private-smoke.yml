name: QuickCommerce single-call private smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quickcommerce-single-call-smoke
  cancel-in-progress: false
jobs:
  one-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tested adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate adapter without API credits
        run: python -m unittest -v test_quickcommerce_flipkart_adapter
      - name: Require existing private API key
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
        run: |
          if [ -z "$QUICKCOMMERCE_API_KEY" ]; then
            echo "::error::QUICKCOMMERCE_API_KEY is not configured"
            exit 1
          fi
          echo "Private API key is configured; value not displayed."
      - name: Run exactly one read-only provider request
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
        run: python scripts/quickcommerce_flipkart_smoke.py --live

name: QuickCommerce bounded catalogue research
on:
  workflow_dispatch:
    inputs:
      category:
        description: "Research audit scope (mobiles first; all includes 20 TVs and 20 earbuds)"
        type: choice
        options: [mobiles, tvs, earbuds, all]
        default: mobiles
      max_calls:
        description: "Hard cap on billed searches (0 is offline)"
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: quickcommerce-single-call-smoke
  cancel-in-progress: false
jobs:
  one-request:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out tested adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate adapter and bounded audit without API credits
        run: python -m unittest -v test_quickcommerce_flipkart_adapter test_quickcommerce_catalogue_audit
      - name: Run bounded research audit (no public writes or automatic retries)
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
          CATEGORY: ${{ inputs.category || 'all' }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: python scripts/quickcommerce_catalogue_audit.py --live --category "$CATEGORY" --max-calls "$MAX_CALLS"
      - name: Preserve observations for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quickcommerce-research-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: private_observations/quickcommerce_audit.json
          if-no-files-found: warn
          retention-days: 14


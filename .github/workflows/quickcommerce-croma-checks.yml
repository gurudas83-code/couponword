name: QuickCommerce existing Croma identity checks
on:
  push:
    branches: [feature/api-price-comparison-20261117]
    paths: [.github/workflows/quickcommerce-croma-checks.yml]
permissions:
  contents: read
jobs:
  check:
    if: contains(github.event.head_commit.message, '[croma-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check nine already-reviewed Croma IDs once each
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
        run: python scripts/quickcommerce_croma_checks.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quickcommerce-croma-checks
          path: private_observations/croma_checks.json
          retention-days: 14

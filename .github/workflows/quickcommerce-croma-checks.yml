name: QuickCommerce existing Croma identity checks
on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: "Spend up to nine item calls for existing reviewed Croma IDs"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    if: inputs.run_checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check existing exact Croma IDs once each
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
        run: python scripts/quickcommerce_croma_checks.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quickcommerce-croma-checks
          path: private_observations/croma_checks.json
          retention-days: 14

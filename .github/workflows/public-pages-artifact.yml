name: Build public GitHub Pages artifact

on:
  workflow_dispatch:
  schedule:
    # Daily at 17:13 IST, ahead of the 18:00–19:00 IST target window.
    - cron: "43 11 * * *"
  push:
    branches:
      - main

permissions:
  actions: read  # Poll for artifact visibility before starting a Pages deployment.
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Playwright 1.56 Chromium supports Ubuntu 24.04, not GitHub's 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore the last price observation snapshot
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/india-daily-prices.json
          key: india-price-watch-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: india-price-watch-
      - name: Restore and refresh the daily India phone watch
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
          COLLECT: ${{ github.run_attempt == 1 && (github.event_name == 'schedule' || (github.event_name == 'push' && github.event.head_commit.message == 'Activate daily India 30-phone price watch')) }}
        run: |
          args=()
          if [[ "$COLLECT" == "true" ]]; then args+=(--collect); fi
          python scripts/daily_phone_prices.py --output "$RUNNER_TEMP/india-daily-prices.json" "${args[@]}"
          echo "CW_DAILY_PRICE_SNAPSHOT=$RUNNER_TEMP/india-daily-prices.json" >> "$GITHUB_ENV"
      - name: Build allow-listed public artifact
        run: python scripts/build_public_pages.py --output public
      - name: Verify curated consumer-tech catalogue and legacy-page retirement
        run: python -m unittest -q test_technical_niche_publication test_seo_index_hygiene
      - name: Validate nineteen model illustrations, full specification routes and API-price gates
        run: python -m unittest -q test_new_mobile_media_prices
      - name: Verify new India mobiles, official sources and searchable hub
        run: python -m unittest -q test_india_recent_eight_import test_new_mobile_visibility
      - name: Check public research and budget contracts
        run: python scripts/quality_audit.py --root public --report quality-audit.json
      - name: Verify accessories and TV evidence, pages and comparison script
        run: |
          python -m unittest -v test_category_research_release
          python -m unittest -v test_tv_earbuds_40_release
          python -m unittest -v test_india_sales_priority_release
          python -m unittest -v test_india_missing_eight_release
          python -m unittest -v test_under25_seo_release
          python -m unittest -v test_mobile_seo_comparisons
          python -m py_compile python/mobile_seo_comparisons.py
          python -m py_compile python/retailer_link_registry.py
          python -m py_compile python/india_sales_priority_pages.py
          python -m py_compile python/india_missing_eight_pages.py
          python -m py_compile python/tv_earbuds_workbook_pages.py
          python -m py_compile python/category_research_pages.py
          node --check assets/category-research.js
      - name: Unit-test production health probe contract
        run: python -m unittest -v test_runtime_health_probe
      - name: Run smartphone recommendation and evidence regression tests
        run: |
          python -m unittest -v             test_phase_g_ranking_contract             test_mobile_research_inventory_visibility             test_mobile_independent_tests             test_publication_policy test_mobile_query_answers test_research_usability test_phone_guides_release test_phone_research_seo test_top30_pilot_seo test_hindi_seo_quality test_seo_index_hygiene             test_recommendation_timeout_guard test_phase_g_frontend_offer test_frontend_recommendation_layout test_final_mobile_release_ui
          python -m unittest -v test_retailer_link_registry
          node test_mobile_workbook_queries.cjs
          node test_standard_guide_fallback.cjs
          node test_search_discovery.cjs
      - name: Prepare Chromium mobile and desktop release QA
        run: |
          python -m pip install playwright==1.56.0
          # GitHub ubuntu-24.04 image already provides the Chromium shared libraries.
          # Avoid apt mirror outages blocking unrelated content deployments.
          python -m playwright install chromium
      - name: Exercise actual search, variants, comparison and backend handoff in Chromium
        run: python scripts/browser_smoke.py --root public --report browser-qa.json
      - name: Verify public artifact has no private or generated files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("public")
          forbidden_names = {
              "admin.html", "validator.html", "python", "reports", "outputs",
              "backups", "backup", "cache", "caches", "secrets", "secret",
              "credentials", "phase_e_current.zip",
          }
          forbidden_suffixes = (".zip", ".env", ".pem", ".key")
          leaks = []
          for path in root.rglob("*"):
              name = path.name.lower()
              if (
                  name in forbidden_names
                  or name.startswith(".env")
                  or name.endswith(forbidden_suffixes)
                  or name in {"secret.json", "credentials.json", "passwords.json"}
              ):
                  leaks.append(str(path.relative_to(root)))
          if leaks:
              raise SystemExit("forbidden files entered Pages artifact: " + ", ".join(leaks))
          print("public artifact verification passed")
          PY
      # A rerun keeps github.run_id but increments github.run_attempt. Using
      # the default "github-pages" name leaves duplicate artifacts behind after
      # retries, which causes deploy-pages to reject the run.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      # The upload API may report success before the artifact becomes visible
      # to the listing API used by deploy-pages. Wait rather than racing it.
      - name: Confirm Pages artifact is visible to the deployment API
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null || true)"
            matches="$(printf '%s\n' "$names" | grep -Fxc "$PAGES_ARTIFACT_NAME" || true)"
            if [ "$matches" -eq 1 ]; then
              echo "Pages artifact is visible on attempt ${attempt}."
              exit 0
            fi
            if [ "$matches" -gt 1 ]; then
              echo "::error::Multiple artifacts share the current attempt's name."
              exit 1
            fi
            echo "Artifact not visible yet (check ${attempt}/18); retrying."
            sleep 5
          done
          echo "::error::Pages artifact did not appear in GitHub Actions API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published phone SEO pages and canonical sitemap
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          origin = "https://coupon-world.in"
          targets = {
              "/compare/": (b"How to compare two phones", b"Galaxy A36", b"Galaxy A56"),
              "/hi/compare/": (b"Galaxy A36", b"Galaxy A56", b"hi-IN"),
              "/phones/under-25000/": (b"Choosing a phone under", b"6.67-inch", b"not a ranking"),
              "/seo/top-30-phone-research-india.html": (b"30 smartphones to research before buying in India", b"POCO X7 Pro", b"Samsung Galaxy A56"),
              "/hi/seo/top-30-phone-research-india.html": (b"hi-IN", b"Samsung Galaxy A56", b"Samsung Galaxy M17"),
              "/hi/phones/under-25000/": (b"6.67-inch", b"hi-IN"),

              "/": (b'href="/phones/"', b'href="/accessories/"', b'href="/tvs/"', b'href="/phones/india-market-demand-q3-2026/"'),
              "/phones/": (b"Browse 50 curated India smartphone research pages", b"/phones/apple-iphone-17/", b"/phones/google-pixel-10/"),
              "/phones/india-market-demand-q3-2026/": (b"6 were missing", b"NOT an official nationwide Top 10 ranking", b"Galaxy A07 5G"),
              "/phones/india-market-demand-q3-2026/samsung-galaxy-a07-5g/": (b"Galaxy A07 5G", b"Manufacturer source", b"noindex,follow"),
              "/phones/samsung-galaxy-a56-5g/": (b"Manufacturer source", b"Unknowns and purchasing limitations"),
              "/phones/google-pixel-10/": (b"Google Pixel 10", b"Manufacturer source"),
              "/phones/samsung-galaxy-f05/": (b"4G LTE", b"Manufacturer source"),
              "/products/oneplus-nord-ce-30/": (b"noindex,follow", b"Current price and stock not verified"),
              "/google54faf165096b5622.html": (b"google-site-verification: google54faf165096b5622.html",),
              "/accessories/": (b"oneplus-buds-3/", b"Apple 20W USB-C Power Adapter"),
              "/accessories/earbuds-20/": (b"Nord Buds 4 Pro", b"20 wireless earbuds"),
              "/tvs/india-20/": (b"QN80H 55", b"20 TVs"),
              "/accessories/earbuds-20/eb06/": (b"Amazon, Flipkart and Croma", b"noindex,follow"),
              "/tvs/india-20/tv06/": (b"Amazon, Flipkart and Croma", b"noindex,follow"),
              "/tvs/": (b"sony-k-43s20-bravia-2/", b"LG UT80"),
              "/accessories/samsung-ep-t2510-25w/": (b"PD 3.0 PPS", b"Maker source"),
              "/tvs/sony-k-43s20-bravia-2/": (b"50 Hz", b"Maker source"),
              "/seo/phones-under-15000.html": (b"Phones Under",),
              "/sitemap.xml": (b"https://coupon-world.in/phones/samsung-galaxy-a56-5g/", b"https://coupon-world.in/tvs/india-20/", b"https://coupon-world.in/accessories/earbuds-20/", b"https://coupon-world.in/phones/india-market-demand-q3-2026/", b"https://coupon-world.in/compare/", b"https://coupon-world.in/hi/compare/"),
          }
          for path, markers in targets.items():
              for attempt in range(10):
                  try:
                      with urlopen(Request(origin+path, headers={"User-Agent":"CouponWorldReleaseMonitor/1.0"}), timeout=20) as res:
                          body = res.read()
                          assert res.status == 200, (path,res.status)
                      assert all(marker in body for marker in markers), "published content not yet updated"
                      print("LIVE PUBLISHED PASS:", path, len(body), "bytes", flush=True)
                      break
                  except Exception as exc:
                      if attempt == 9:
                          raise RuntimeError("LIVE PUBLISHED FAIL: "+path) from exc
                      time.sleep(5)
          # The curated answer publisher intentionally reintroduces /answers/
          # and only its reviewed, evidence-backed question routes. The
          # historical retirement list is not authoritative for these pages.
          coverage = json.loads(Path("public/data/mobile_query_answer_coverage.json").read_text(encoding="utf-8"))
          reviewed_answers = {"/answers/", "/hi/answers/"}
          for row in coverage["answers"]:
              if row["indexable"]:
                  reviewed_answers.update((row["route"], row["hindi_route"]))
          sitemap_urls = {
              element.text
              for element in ET.parse("public/sitemap.xml").getroot().iter()
              if element.tag.endswith("}loc")
          }
          for path in sorted(reviewed_answers):
              assert origin + path in sitemap_urls, "Reviewed answer missing from sitemap: " + path
              for attempt in range(10):
                  try:
                      with urlopen(Request(origin + path, headers={"User-Agent":"CouponWorldReleaseMonitor/1.0"}), timeout=20) as res:
                          body = res.read()
                          assert res.status == 200, (path, res.status)
                      assert f'<link rel="canonical" href="{origin + path}"'.encode() in body, "answer canonical mismatch"
                      assert b'<meta name="robots" content="index,follow' in body, "reviewed answer not indexable"
                      print("REVIEWED ANSWER PASS:", path, flush=True)
                      break
                  except Exception as exc:
                      if attempt == 9:
                          raise RuntimeError("REVIEWED ANSWER FAIL: " + path) from exc
                      time.sleep(5)

          # Only truly retired routes should return 404. A historical route
          # revived through the reviewed-answer gate must remain accessible.
          retired = (
              "/answers/", "/answers/phone-under-25000-with-amoled-ois-and-8gb-ram/",
              "/hi/answers/phone-under-25000-with-amoled-ois-and-8gb-ram/",
              "/compare/apple-iphone-17-vs-apple-iphone-16/",
              "/phones/under-25000/best-camera/", "/phones/under-25000/poco-x7-pro-5g/",
              "/seo/best-earbuds-under-2000.html",
          )
          for path in retired:
              if path in reviewed_answers:
                  print("REVIEWED ANSWER EXEMPT FROM RETIREMENT:", path, flush=True)
                  continue
              try:
                  with urlopen(Request(origin + path, headers={"User-Agent":"CouponWorldReleaseMonitor/1.0"}), timeout=20) as res:
                      raise AssertionError("Retired URL returned " + str(res.status) + ": " + path)
              except HTTPError as error:
                  assert error.code == 404, (path, error.code)
                  print("RETIRED URL 404 PASS:", path, flush=True)
          PY

name: QuickCommerce comparison integration
on:
  push:
    branches: [feature/api-price-comparison-20261117]
    paths: [.github/workflows/quickcommerce-comparison.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quickcommerce-comparison
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[comparison-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest -q test_quickcommerce_flipkart_adapter test_quickcommerce_catalogue_audit
      - name: Inspect 17 provider responses without public writes
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
        run: python scripts/quickcommerce_provider_diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quickcommerce-provider-diagnostics
          path: private_observations/provider_diagnostics.json
          retention-days: 14

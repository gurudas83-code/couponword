name: QuickCommerce comparison integration
on:
  push:
    branches: [work/missing-mobile-api-prices]
    paths: ['.github/workflows/quickcommerce-comparison.yml']
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Only Top-30 mobile Flipkart research, maximum 2 paid calls; 0 does not run"
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: quickcommerce-comparison
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'push' || inputs.max_calls > 0
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest -q test_quickcommerce_flipkart_adapter test_quickcommerce_catalogue_audit test_api_price_observations
      - name: Collect bounded observations for review; do not publish or retimestamp
        env:
          QUICKCOMMERCE_API_KEY: ${{ secrets.QUICKCOMMERCE_API_KEY }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python scripts/refresh_api_comparison.py --missing-prices --max-calls 206
          else
            python scripts/refresh_api_comparison.py --max-calls "$MAX_CALLS"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quickcommerce-comparison-refresh
          path: |
            private_observations/provider_refresh.json
            private_observations/missing_mobile_api_prices.json
          retention-days: 14

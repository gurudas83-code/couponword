name: Daily Coupon Bot (review-only)
on:
  # 09:00 IST. This job NEVER pushes generated affiliate links to production.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coupon-bot-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Reject invalid source data rather than silently replacing production
        run: python -m json.tool coupons.json > /dev/null
      - name: Generate a review-only candidate in runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coupon-review"
          cp coupons.json "$RUNNER_TEMP/coupon-review/coupons.json"
          (
            cd "$RUNNER_TEMP/coupon-review"
            python "$GITHUB_WORKSPACE/coupon_bot.py"
          )
          python -m json.tool "$RUNNER_TEMP/coupon-review/coupons.json" > /dev/null
          echo "Review candidate created; repository unchanged and no publication performed."
      - name: Upload candidate for manual source and offer verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coupon-bot-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coupon-review/coupons.json
          if-no-files-found: error
          retention-days: 7

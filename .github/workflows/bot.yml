name: Daily Coupon Bot
on:
  schedule:
    - cron: '30 3 * * *'  # रोज 9 AM IST
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      - run: python coupon_bot.py
      - run: |
          git config user.name "Coupon Bot"
          git config user.email "bot@coupon-world.in"
          git add coupons.json
          git commit -m "Bot: Added new coupons" || exit 0
          git push
